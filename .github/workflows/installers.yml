name: Installers

on:
  push:
    branches: ['**']
    paths:
      - install.sh
      - install.ps1
      - npm/**
      - scripts/smoke-install.sh
      - scripts/smoke-install.ps1
      - .github/workflows/installers.yml
  pull_request:
    paths:
      - install.sh
      - install.ps1
      - npm/**
      - scripts/smoke-install.sh
      - scripts/smoke-install.ps1
      - .github/workflows/installers.yml
  # After a release, every channel must install the version that was just tagged.
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: Check that every channel's latest install is this version (for example 0.4.3). Leave empty to test this checkout.
        required: false
        default: ''

permissions:
  contents: read

env:
  # A tag push makes head_branch the tag name.
  MEMCRATE_EXPECT_VERSION: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || inputs.version }}

jobs:
  unix:
    name: ${{ matrix.channel == 'script' && 'install.sh' || matrix.channel }} (${{ matrix.os }})
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        channel: [script, npm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Smoke test
        # Release does not publish pre-releases to npm.
        if: matrix.channel != 'npm' || !contains(env.MEMCRATE_EXPECT_VERSION, '-')
        run: sh scripts/smoke-install.sh ${{ matrix.channel }}

  windows:
    name: ${{ matrix.channel == 'script' && 'install.ps1' || 'npm' }} (${{ matrix.shell }})
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        # powershell is Windows PowerShell 5.1, what `irm | iex` runs under by default.
        shell: [powershell, pwsh]
        channel: [script, npm]
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Smoke test
        if: matrix.channel != 'npm' || !contains(env.MEMCRATE_EXPECT_VERSION, '-')
        run: ${{ matrix.shell }} -NoProfile -ExecutionPolicy Bypass -File scripts/smoke-install.ps1 ${{ matrix.channel }}

  # cargo installs the published crate, so it only has something to check after a release.
  cargo:
    name: cargo (ubuntu-latest)
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && !contains(github.event.workflow_run.head_branch, '-'))
      || (github.event_name == 'workflow_dispatch' && inputs.version != '' && !contains(inputs.version, '-'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Smoke test
        run: sh scripts/smoke-install.sh cargo
